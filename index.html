<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hydro Dip 1-of-1 Ultra Studio</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f43f5e" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }

    /* Fluid Gloss Sheen Overlay */
    .liquid-gloss {
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.05) 25%, transparent 55%, rgba(0,0,0,0.3) 100%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* 3D Immersion & Film Adhesion Animation */
    @keyframes hydroSubmerge {
      0% {
        transform: translateY(-135%) scale(0.8) rotateX(45deg);
        opacity: 0;
        filter: drop-shadow(0 45px 35px rgba(0,0,0,0.9));
      }
      35% {
        transform: translateY(-12%) scale(0.96) rotateX(18deg);
        opacity: 1;
        filter: drop-shadow(0 30px 25px rgba(244,63,94,0.35));
      }
      50% {
        transform: translateY(0%) scale(1) rotateX(0deg);
        filter: drop-shadow(0 15px 35px rgba(0,0,0,0.85));
      }
      70% {
        transform: translateY(3%) scale(1.02);
      }
      100% {
        transform: translateY(0%) scale(1);
        filter: drop-shadow(0 25px 45px rgba(0,0,0,0.95));
      }
    }

    .animate-submerge {
      animation: hydroSubmerge 2.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    /* Liquid Ripple Ring Animation */
    @keyframes rippleExpand {
      0% { transform: scale(0.2); opacity: 0.9; }
      100% { transform: scale(3.2); opacity: 0; }
    }
    .ripple-fx {
      animation: rippleExpand 1.2s cubic-bezier(0, 0.2, 0.8, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900/90 rounded-3xl shadow-2xl p-4 border border-slate-800/80 mt-2 mb-8 backdrop-blur-md">
    
    <!-- PWA Install Banner -->
    <div id="installBanner" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-rose-400">Install Hydro Dip App</p>
        <p class="text-slate-400">Mint 1-of-1 screen skins offline</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-slate-950 text-xs font-bold rounded-xl transition-all">
        Install
      </button>
    </div>

    <!-- Phase Indicator -->
    <div class="text-center mb-3">
      <span id="stageBadge" class="text-[10px] font-black uppercase tracking-widest bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full shadow-sm">
        Stage 1 • Paint Dropper
      </span>
      <h1 id="stageTitle" class="text-xl font-black text-white mt-1.5 tracking-tight">Dispense Pigments</h1>
      <p id="stageSubtitle" class="text-[11px] text-slate-400">Tap inside the bath to release organic, marbled ink drops</p>
    </div>

    <!-- Hydro Bath Chamber -->
    <div class="relative w-full max-w-[270px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700/80 shadow-[inset_0_0_35px_rgba(0,0,0,0.85)] bg-[#04060a] mb-3 aspect-[9/16] perspective-1000">
      
      <!-- Surface Simulation Canvas -->
      <canvas id="waterCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
      
      <!-- Optical Liquid Gloss Layer -->
      <div class="absolute inset-0 liquid-gloss"></div>

      <!-- Ripple Animation Layer -->
      <div id="rippleContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

      <!-- 3D Phone Shell (Immersed Phone Chassis) -->
      <div id="phoneRig" class="hidden absolute inset-2.5 rounded-[38px] border-[7px] border-slate-950 overflow-hidden bg-slate-950 shadow-2xl">
        <!-- Bezel Speaker & Dynamic Island -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-24 h-4 bg-black rounded-full z-40 flex items-center justify-end px-2">
          <div class="w-2 h-2 rounded-full bg-slate-900 border border-slate-800"></div>
        </div>
        <!-- Dipped Surface Film -->
        <canvas id="phoneSkinCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
        <!-- Glass Specular Reflection Highlight -->
        <div class="absolute inset-0 bg-gradient-to-tr from-white/20 via-transparent to-black/50 pointer-events-none z-30"></div>
      </div>

    </div>

    <!-- Stage 1: Color Pigments Panel -->
    <div id="stage1Controls" class="space-y-3">
      <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Pigment:</span>
        <div class="flex gap-2" id="palette">
          <button onclick="pickPigment('#e11d48', '#881337')" class="w-7 h-7 rounded-full bg-gradient-to-br from-rose-500 to-rose-900 border-2 border-white ring-2 ring-rose-500 scale-110 pigment-btn"></button>
          <button onclick="pickPigment('#0284c7', '#082f49')" class="w-7 h-7 rounded-full bg-gradient-to-br from-sky-500 to-sky-950 border-2 border-transparent pigment-btn"></button>
          <button onclick="pickPigment('#f59e0b', '#78350f')" class="w-7 h-7 rounded-full bg-gradient-to-br from-amber-400 to-amber-800 border-2 border-transparent pigment-btn"></button>
          <button onclick="pickPigment('#a855f7', '#3b0764')" class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-purple-950 border-2 border-transparent pigment-btn"></button>
          <button onclick="pickPigment('#10b981', '#064e3b')" class="w-7 h-7 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-900 border-2 border-transparent pigment-btn"></button>
          <button onclick="pickPigment('#ffffff', '#94a3b8')" class="w-7 h-7 rounded-full bg-gradient-to-br from-white to-slate-400 border-2 border-transparent pigment-btn"></button>
        </div>
      </div>

      <button id="toSwirlBtn" onclick="initiateSwirlStage()" disabled class="w-full bg-slate-800 text-slate-500 font-black py-3 rounded-xl text-xs tracking-wider transition-all cursor-not-allowed">
        Drop At Least 4 Pigments (0/4)
      </button>
    </div>

    <!-- Stage 2: Hydro Comb & Swirl Panel -->
    <div id="stage2Controls" class="hidden space-y-2">
      <p class="text-[11px] text-center text-cyan-400 font-semibold animate-pulse">
        Drag and comb across the tank to swirl liquid filaments!
      </p>
      <button onclick="performSubmersion()" class="w-full bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-rose-500/20 active:scale-95 transition-all">
        Submerge & Coat Phone 📱🌊
      </button>
    </div>

    <!-- Stage 3: Export 1-of-1 Film -->
    <div id="stage3Controls" class="hidden space-y-2">
      <button onclick="saveCoatedWallpaper()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
        Save 1-of-1 Marbled Wallpaper 📥
      </button>
      <button onclick="flushBath()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition-colors">
        Fresh Water Bath 🔄
      </button>
    </div>

    <!-- Adsterra Monetization Slot -->
    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-center">
      <iframe srcdoc="<!DOCTYPE html><html><head></head><body style='margin:0;display:flex;justify-content:center;'><script type='text/javascript'>atOptions={'key':'45775fbece61c0f117b4d413d29f50b6','format':'iframe','height':50,'width':320,'params':{}};</script><script type='text/javascript' src='https://www.highrevenueformat.com/45775fbece61c0f117b4d413d29f50b6/invoke.js'></script></body></html>" width="320" height="50" style="border:none; overflow:hidden;" scrolling="no" sandbox="allow-scripts allow-same-origin allow-popups allow-top-navigation"></iframe>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('waterCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    let stage = 1;
    let selectedColor = '#e11d48';
    let selectedDark = '#881337';
    let drops = [];
    let isCombing = false;
    let combOrigin = null;

    // Realistic Multi-Layer Organic Drop Engine
    class OrganicDrop {
      constructor(cx, cy, r, primary, secondary) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.primary = primary;
        this.secondary = secondary;
        this.rings = [];

        // 7 concentric fluid contours with organic perimeter noise
        const count = 7;
        for (let i = 1; i <= count; i++) {
          const vertices = [];
          const pts = 140;
          const ringRadius = (r / count) * i;
          
          for (let j = 0; j < pts; j++) {
            const angle = (j / pts) * Math.PI * 2;
            const variance = 1 + (Math.sin(j * 4) * 0.04);
            vertices.push({
              x: cx + Math.cos(angle) * ringRadius * variance,
              y: cy + Math.sin(angle) * ringRadius * variance
            });
          }
          this.rings.push({
            vertices,
            isEdge: i === count,
            level: i / count
          });
        }
      }

      displace(other) {
        for (let ring of this.rings) {
          for (let v of ring.vertices) {
            const dx = v.x - other.cx;
            const dy = v.y - other.cy;
            const d = Math.hypot(dx, dy);
            const factor = Math.sqrt(1 + (other.r * other.r) / (d * d || 0.001));
            v.x = other.cx + dx * factor;
            v.y = other.cy + dy * factor;
          }
        }
      }

      tine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const mag = Math.hypot(dx, dy);
        if (mag === 0) return;
        const uX = dx / mag;
        const uY = dy / mag;

        const power = 48;
        const falloff = 80;

        for (let ring of this.rings) {
          for (let v of ring.vertices) {
            const pX = v.x - x0;
            const pY = v.y - y0;
            const perp = Math.abs(pX * (-uY) + pY * uX);
            const pull = power * Math.exp(-perp / falloff);
            v.x += uX * pull;
            v.y += uY * pull;
          }
        }
      }

      render(targetCtx) {
        for (let ring of this.rings) {
          targetCtx.beginPath();
          
          // Realistic fluid gradient: edges receive darker shade and feathered borders
          if (ring.isEdge) {
            targetCtx.fillStyle = this.secondary;
            targetCtx.shadowColor = 'rgba(0,0,0,0.45)';
            targetCtx.shadowBlur = 6;
          } else {
            targetCtx.fillStyle = this.primary;
            targetCtx.shadowBlur = 0;
          }

          for (let i = 0; i < ring.vertices.length; i++) {
            const v = ring.vertices[i];
            if (i === 0) targetCtx.moveTo(v.x, v.y);
            else targetCtx.lineTo(v.x, v.y);
          }
          targetCtx.closePath();
          targetCtx.fill();
        }
        targetCtx.shadowBlur = 0;
      }
    }

    function initBath() {
      // Deep abyssal water base
      const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W);
      grad.addColorStop(0, '#0a0f1d');
      grad.addColorStop(1, '#020307');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function pickPigment(primary, dark) {
      selectedColor = primary;
      selectedDark = dark;
      document.querySelectorAll('.pigment-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-rose-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-rose-500');
      event.target.classList.remove('border-transparent');
    }

    function addPigmentDrop(x, y) {
      triggerRipple(x, y);

      const radius = 140 + Math.random() * 90;
      const drop = new OrganicDrop(x, y, radius, selectedColor, selectedDark);
      
      for (let d of drops) {
        d.displace(drop);
      }
      drops.push(drop);
      renderAll();

      if (stage === 1) {
        const btn = document.getElementById('toSwirlBtn');
        if (drops.length >= 4) {
          btn.disabled = false;
          btn.className = "w-full bg-rose-500 hover:bg-rose-400 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider transition-all shadow-lg shadow-rose-500/20";
          btn.innerText = `Water Ready! Enter Marbling Phase ➔ (${drops.length} Drops)`;
        } else {
          btn.innerText = `Drop At Least 4 Pigments (${drops.length}/4)`;
        }
      }
    }

    function triggerRipple(x, y) {
      const container = document.getElementById('rippleContainer');
      const rect = canvas.getBoundingClientRect();
      const screenX = (x / W) * rect.width;
      const screenY = (y / H) * rect.height;

      const ripple = document.createElement('div');
      ripple.className = 'absolute rounded-full border border-white/50 ripple-fx pointer-events-none -translate-x-1/2 -translate-y-1/2';
      ripple.style.left = `${screenX}px`;
      ripple.style.top = `${screenY}px`;
      ripple.style.width = '40px';
      ripple.style.height = '40px';

      container.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1200);
    }

    function renderAll() {
      initBath();
      for (let d of drops) {
        d.render(ctx);
      }
    }

    function initiateSwirlStage() {
      stage = 2;
      document.getElementById('stageBadge').innerText = 'Stage 2 • Ebru Marbling';
      document.getElementById('stageBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-full shadow-sm';
      document.getElementById('stageTitle').innerText = 'Comb & Swirl The Bath';
      document.getElementById('stageSubtitle').innerText = 'Drag across the liquid to stretch and interlace color ribbons';
      document.getElementById('stage1Controls').classList.add('hidden');
      document.getElementById('stage2Controls').classList.remove('hidden');
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);

      if (stage === 1) {
        addPigmentDrop(x, y);
      } else if (stage === 2) {
        isCombing = true;
        combOrigin = { x, y };
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (stage !== 2 || !isCombing || !combOrigin) return;
      const rect = canvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let d of drops) {
        d.tine(combOrigin.x, combOrigin.y, cur.x, cur.y);
      }
      combOrigin = cur;
      renderAll();
    });

    window.addEventListener('pointerup', () => {
      isCombing = false;
      combOrigin = null;
    });

    function performSubmersion() {
      stage = 3;
      const phoneRig = document.getElementById('phoneRig');
      const skinCanvas = document.getElementById('phoneSkinCanvas');
      const skinCtx = skinCanvas.getContext('2d');

      // Transfer exact marbled pattern
      skinCtx.drawImage(canvas, 0, 0);

      // Micro-frequency anti-screen grating overlay
      skinCtx.lineWidth = 1;
      for (let y = 0; y < H; y += 4) {
        skinCtx.strokeStyle = (y % 8 === 0) ? 'rgba(255, 255, 255, 0.04)' : 'rgba(0, 0, 0, 0.04)';
        skinCtx.beginPath();
        skinCtx.moveTo(0, y);
        skinCtx.lineTo(W, y);
        skinCtx.stroke();
      }

      phoneRig.classList.remove('hidden');
      phoneRig.classList.add('animate-submerge');

      document.getElementById('stageBadge').innerText = 'Stage 3 • Dipped & Cured';
      document.getElementById('stageBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full shadow-sm';
      document.getElementById('stageTitle').innerText = 'Coated & Transferred ✨';
      document.getElementById('stageSubtitle').innerText = 'Your unique hydro film is securely locked to your display dimensions';

      document.getElementById('stage2Controls').classList.add('hidden');
      document.getElementById('stage3Controls').classList.remove('hidden');
    }

    function saveCoatedWallpaper() {
      const skinCanvas = document.getElementById('phoneSkinCanvas');
      skinCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `hydro-marbled-1of1-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    function flushBath() {
      drops = [];
      stage = 1;
      document.getElementById('phoneRig').classList.add('hidden');
      document.getElementById('phoneRig').classList.remove('animate-submerge');
      document.getElementById('stage3Controls').classList.add('hidden');
      document.getElementById('stage1Controls').classList.remove('hidden');

      const btn = document.getElementById('toSwirlBtn');
      btn.disabled = true;
      btn.className = "w-full bg-slate-800 text-slate-500 font-black py-3 rounded-xl text-xs tracking-wider transition-all cursor-not-allowed";
      btn.innerText = "Drop At Least 4 Pigments (0/4)";

      document.getElementById('stageBadge').innerText = 'Stage 1 • Paint Dropper';
      document.getElementById('stageBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full shadow-sm';
      document.getElementById('stageTitle').innerText = 'Dispense Pigments';
      document.getElementById('stageSubtitle').innerText = 'Tap inside the bath to release organic, marbled ink drops';

      initBath();
    }

    // PWA Prompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    initBath();
  </script>
</body>
</html>
