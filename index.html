<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Real Hydro Dip Body Marbling</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <div id="installBanner" class="hidden mb-4 p-3 bg-pink-500/10 border border-pink-500/30 rounded-2xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-pink-400">Install Hydro Studio</p>
        <p class="text-slate-400">Dip custom wallpapers offline</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-slate-950 text-xs font-bold rounded-xl transition-all">
        Install
      </button>
    </div>

    <div class="text-center mb-3">
      <span class="text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
        Ultra-Dense Ebru Marbling
      </span>
      <h1 class="text-xl font-black text-white mt-1">Real Hydrographic Dipping</h1>
      <p class="text-[11px] text-slate-400">Drag to comb hundreds of ultra-thin paint filaments</p>
    </div>

    <div class="relative w-full max-w-[270px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black mb-3 aspect-[9/16]">
      <canvas id="marblingCanvas" width="1080" height="1920" class="w-full h-full object-cover cursor-crosshair"></canvas>
    </div>

    <div class="space-y-3 text-xs">
      <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Palette:</span>
        <div class="flex gap-2">
          <button onclick="changeTheme('purpleArm')" title="Arm Photo Palette" class="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-700 via-pink-500 to-amber-200 border-2 border-white ring-2 ring-pink-500 scale-110 pal-btn"></button>
          <button onclick="changeTheme('uvNeon')" title="UV Neon Face" class="w-7 h-7 rounded-full bg-gradient-to-tr from-cyan-400 via-emerald-400 to-amber-400 border-2 border-transparent pal-btn"></button>
          <button onclick="changeTheme('classic')" title="Gif Tank Classic" class="w-7 h-7 rounded-full bg-gradient-to-tr from-rose-600 via-orange-500 to-neutral-900 border-2 border-transparent pal-btn"></button>
          <button onclick="changeTheme('psychedelic')" title="Electric Rainbow" class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 via-emerald-400 to-fuchsia-500 border-2 border-transparent pal-btn"></button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="reseedDenseTank()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xs transition-colors">
          Re-Dip Rings 🌀
        </button>
        <button onclick="combRakeEffect()" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-3 rounded-xl text-xs transition-colors">
          Auto Comb Rake 🔱
        </button>
      </div>

      <button onclick="downloadDippedArtwork()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
        Download 1-of-1 Marbled Wallpaper 📥
      </button>

      <p class="text-[10px] text-center text-slate-500">
        👆 Drag your finger across the canvas to comb the tight color ribbons
      </p>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('marblingCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    // Palettes taken directly from your real reference images
    const themes = {
      purpleArm: ['#120826', '#3b0764', '#7e22ce', '#c084fc', '#f43f5e', '#fb7185', '#38bdf8', '#fef08a', '#ffffff', '#0f172a'],
      uvNeon: ['#030712', '#06b6d4', '#22d3ee', '#10b981', '#34d399', '#f59e0b', '#fbbf24', '#0284c7', '#022c22'],
      classic: ['#000000', '#dc2626', '#b91c1c', '#ea580c', '#fb923c', '#fef08a', '#ffffff', '#18181b'],
      psychedelic: ['#030712', '#2563eb', '#06b6d4', '#10b981', '#a855f7', '#ec4899', '#facc15', '#ffffff']
    };

    let activeColors = themes.purpleArm;
    let rings = [];
    let isDragging = false;
    let prevPoint = null;

    class FilamentRing {
      constructor(cx, cy, r, color) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.color = color;
        this.points = [];
        const numPoints = 160;
        for (let i = 0; i < numPoints; i++) {
          const a = (i / numPoints) * Math.PI * 2;
          this.points.push({
            x: cx + Math.cos(a) * r,
            y: cy + Math.sin(a) * r
          });
        }
      }

      tine(x0, y0, x1, y1, power = 45, falloff = 90) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const dist = Math.hypot(dx, dy);
        if (dist === 0) return;
        const ux = dx / dist;
        const uy = dy / dist;

        for (let p of this.points) {
          const px = p.x - x0;
          const py = p.y - y0;
          const perp = Math.abs(px * (-uy) + py * ux);
          const pull = power * Math.exp(-perp / falloff);
          p.x += ux * pull;
          p.y += uy * pull;
        }
      }

      draw(c) {
        c.beginPath();
        c.strokeStyle = this.color;
        c.lineWidth = 3.5; // Thin tightly-packed lines like the photo
        for (let i = 0; i < this.points.length; i++) {
          const p = this.points[i];
          if (i === 0) c.moveTo(p.x, p.y);
          else c.lineTo(p.x, p.y);
        }
        c.closePath();
        c.stroke();
      }
    }

    function changeTheme(key) {
      activeColors = themes[key];
      document.querySelectorAll('.pal-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
      event.target.classList.remove('border-transparent');
      reseedDenseTank();
    }

    // Creates 250+ razor-thin concentric rings (the authentic Ebru water setup)
    function reseedDenseTank() {
      rings = [];
      ctx.fillStyle = activeColors[0];
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2;
      const cy = H / 2;
      const totalRings = 260; // Dense filaments like real marbling
      const spacing = 4.5;

      for (let i = 1; i <= totalRings; i++) {
        const r = i * spacing;
        const color = activeColors[i % activeColors.length];
        rings.push(new FilamentRing(cx, cy, r, color));
      }

      // Initial natural liquid stretch
      combRakeEffect();
    }

    function renderScene() {
      ctx.fillStyle = activeColors[0];
      ctx.fillRect(0, 0, W, H);
      for (let ring of rings) {
        ring.draw(ctx);
      }
    }

    // Simulates dragging the multi-tooth rake comb through the water
    function combRakeEffect() {
      const teeth = 7;
      const step = W / teeth;
      for (let i = 0; i <= teeth; i++) {
        const startX = i * step + (Math.random() * 40 - 20);
        const endX = startX + (Math.random() * 80 - 40);
        const dir = (i % 2 === 0) ? 1 : -1;
        
        const y0 = (dir === 1) ? -100 : H + 100;
        const y1 = (dir === 1) ? H + 100 : -100;

        for (let ring of rings) {
          ring.tine(startX, y0, endX, y1, 55, 110);
        }
      }
      renderScene();
    }

    // Manual finger touch combing
    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      const rect = canvas.getBoundingClientRect();
      prevPoint = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !prevPoint) return;
      const rect = canvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let ring of rings) {
        ring.tine(prevPoint.x, prevPoint.y, cur.x, cur.y, 45, 95);
      }

      prevPoint = cur;
      renderScene();
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
      prevPoint = null;
    });

    function downloadDippedArtwork() {
      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `hydro-dipped-1of1-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    // PWA Support
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    reseedDenseTank();
  </script>
</body>
</html>
