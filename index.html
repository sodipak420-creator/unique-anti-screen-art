<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hydro Dipping 1-of-1 Transfer Studio</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }

    @keyframes plungeDip {
      0% {
        transform: translateY(-120%) scale(0.8) rotateX(35deg);
        opacity: 0;
      }
      40% {
        transform: translateY(0%) scale(1) rotateX(0deg);
        opacity: 1;
        box-shadow: 0 0 50px rgba(236, 72, 153, 0.7);
      }
      70% {
        transform: translateY(4%) scale(1.02);
      }
      100% {
        transform: translateY(0%) scale(1);
        box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      }
    }

    .dip-active {
      animation: plungeDip 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <div id="installBanner" class="hidden mb-4 p-3 bg-pink-500/10 border border-pink-500/30 rounded-2xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-pink-400">Install Hydro Studio</p>
        <p class="text-slate-400">Dip custom wallpapers offline</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-slate-950 text-xs font-bold rounded-xl transition-all">
        Install
      </button>
    </div>

    <div class="text-center mb-3">
      <span id="stepBadge" class="text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
        Step 1: Prep Fluid Tank
      </span>
      <h1 id="stepTitle" class="text-xl font-black text-white mt-1">Drip & Swirl Colors</h1>
      <p id="stepDesc" class="text-[11px] text-slate-400">Tap to drip, drag to swirl paint on the water</p>
    </div>

    <div class="relative w-full max-w-[270px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black mb-3 aspect-[9/16] perspective-1000">
      
      <canvas id="tankCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>

      <div id="phoneRig" class="hidden absolute inset-2.5 rounded-[36px] border-[6px] border-slate-950 overflow-hidden bg-black shadow-2xl">
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-20 h-4 bg-black rounded-full z-30"></div>
        <canvas id="transferredSkinCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
      </div>

    </div>

    <div id="step1Controls" class="space-y-3">
      <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Ink Color:</span>
        <div class="flex gap-2" id="paletteBar">
          <button onclick="pickColor('#f43f5e')" class="w-7 h-7 rounded-full bg-rose-500 border-2 border-white ring-2 ring-pink-500 scale-110 color-btn"></button>
          <button onclick="pickColor('#06b6d4')" class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#fbbf24')" class="w-7 h-7 rounded-full bg-amber-400 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#a855f7')" class="w-7 h-7 rounded-full bg-purple-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-transparent color-btn"></button>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="clearTank()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-colors">
          Clear 🌊
        </button>
        <button onclick="executeHydroDipTransfer()" class="w-2/3 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
          Dip Phone Into Paint 📱🌊
        </button>
      </div>
      <p class="text-[10px] text-center text-slate-500">Tap anywhere to add color rings • Drag to swirl</p>
    </div>

    <div id="step2Controls" class="hidden space-y-2">
      <button onclick="downloadTransferredWallpaper()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
        Download 1-of-1 Transferred Wallpaper 📥
      </button>
      <button onclick="resetApp()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition-colors">
        Fresh Water Bath 🔄
      </button>
    </div>

  </main>

  <script>
    const tankCanvas = document.getElementById('tankCanvas');
    const tankCtx = tankCanvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    let selectedColor = '#f43f5e';
    let drops = [];
    let isSwirling = false;
    let lastPoint = null;

    class FluidDrop {
      constructor(cx, cy, r, color) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.color = color;
        this.vertices = [];
        const pts = 120;
        for (let i = 0; i < pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          this.vertices.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
      }

      displace(other) {
        for (let v of this.vertices) {
          const dx = v.x - other.cx;
          const dy = v.y - other.cy;
          const d = Math.hypot(dx, dy);
          const factor = Math.sqrt(1 + (other.r * other.r) / (d * d || 0.001));
          v.x = other.cx + dx * factor;
          v.y = other.cy + dy * factor;
        }
      }

      tine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const mag = Math.hypot(dx, dy);
        if (mag === 0) return;
        const uX = dx / mag;
        const uY = dy / mag;
        const power = 38;
        const decay = 65;

        for (let v of this.vertices) {
          const pX = v.x - x0;
          const pY = v.y - y0;
          const perp = Math.abs(pX * (-uY) + pY * uX);
          const pull = power * Math.exp(-perp / decay);
          v.x += uX * pull;
          v.y += uY * pull;
        }
      }

      draw(c) {
        c.beginPath();
        c.fillStyle = this.color;
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          if (i === 0) c.moveTo(v.x, v.y);
          else c.lineTo(v.x, v.y);
        }
        c.closePath();
        c.fill();
      }
    }

    function initTank() {
      tankCtx.fillStyle = '#060911';
      tankCtx.fillRect(0, 0, W, H);
    }

    function pickColor(hex) {
      selectedColor = hex;
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
      event.target.classList.remove('border-transparent');
    }

    function addInk(x, y) {
      const r = 120 + Math.random() * 80;
      const drop = new FluidDrop(x, y, r, selectedColor);
      for (let d of drops) d.displace(drop);
      drops.push(drop);
      renderTank();
    }

    function renderTank() {
      initTank();
      for (let d of drops) d.draw(tankCtx);
    }

    tankCanvas.addEventListener('pointerdown', (e) => {
      const rect = tankCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);
      isSwirling = true;
      lastPoint = { x, y };
      addInk(x, y);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isSwirling || !lastPoint) return;
      const rect = tankCanvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let d of drops) {
        d.tine(lastPoint.x, lastPoint.y, cur.x, cur.y);
      }
      lastPoint = cur;
      renderTank();
    });

    window.addEventListener('pointerup', () => {
      isSwirling = false;
      lastPoint = null;
    });

    // PHYSICAL TRANSFER ENGINE (Deforms the floating film onto the glass)
    function executeHydroDipTransfer() {
      if (drops.length === 0) {
        alert("Tap the water to add paint first!");
        return;
      }

      const phoneRig = document.getElementById('phoneRig');
      const skinCanvas = document.getElementById('transferredSkinCanvas');
      const skinCtx = skinCanvas.getContext('2d');

      // 1. Get raw source pixels from the water tank
      const srcData = tankCtx.getImageData(0, 0, W, H);
      const srcPixels = srcData.data;

      // 2. Create warped destination buffer
      const destData = skinCtx.createImageData(W, H);
      const destPixels = destData.data;

      const centerX = W / 2;
      const centerY = H / 2;
      const maxDist = Math.hypot(centerX, centerY);

      // Hydrodynamic deformation math: pulls the film inward as water pushes outward
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const dx = x - centerX;
          const dy = y - centerY;
          const r = Math.hypot(dx, dy) / maxDist;
          const angle = Math.atan2(dy, dx);

          // Hydro-shear equation: stretch edges, twist center, and wrap borders
          const pinch = Math.pow(r, 0.78);
          const twist = Math.sin(r * 3.5) * 0.12;

          let srcX = Math.floor(centerX + Math.cos(angle + twist) * (pinch * maxDist));
          let srcY = Math.floor(centerY + Math.sin(angle + twist) * (pinch * maxDist));

          // Clamp coordinates
          srcX = Math.max(0, Math.min(W - 1, srcX));
          srcY = Math.max(0, Math.min(H - 1, srcY));

          const destIdx = (y * W + x) * 4;
          const srcIdx = (srcY * W + srcX) * 4;

          destPixels[destIdx]     = srcPixels[srcIdx];
          destPixels[destIdx + 1] = srcPixels[srcIdx + 1];
          destPixels[destIdx + 2] = srcPixels[srcIdx + 2];
          destPixels[destIdx + 3] = 255;
        }
      }

      skinCtx.putImageData(destData, 0, 0);

      // 3. Physical Wrap Vignette (Darkens the borders where paint folds around the edges)
      const edgeVignette = skinCtx.createRadialGradient(centerX, centerY, W * 0.38, centerX, centerY, W * 0.7);
      edgeVignette.addColorStop(0, 'rgba(0,0,0,0)');
      edgeVignette.addColorStop(0.85, 'rgba(0,0,0,0.35)');
      edgeVignette.addColorStop(1, 'rgba(0,0,0,0.88)');
      skinCtx.fillStyle = edgeVignette;
      skinCtx.fillRect(0, 0, W, H);

      // 4. Glossy Specular Sheen (Clear coat reflection beam)
      const sheenGrad = skinCtx.createLinearGradient(0, 0, W, H);
      sheenGrad.addColorStop(0.18, 'rgba(255,255,255,0.25)');
      sheenGrad.addColorStop(0.24, 'rgba(255,255,255,0.05)');
      sheenGrad.addColorStop(0.42, 'transparent');
      sheenGrad.addColorStop(0.72, 'rgba(255,255,255,0.1)');
      sheenGrad.addColorStop(0.76, 'transparent');
      skinCtx.fillStyle = sheenGrad;
      skinCtx.fillRect(0, 0, W, H);

      // 5. Anti-Screenshot High-Frequency Grating
      skinCtx.lineWidth = 1;
      for (let y = 0; y < H; y += 4) {
        skinCtx.strokeStyle = (y % 8 === 0) ? 'rgba(255, 255, 255, 0.035)' : 'rgba(0, 0, 0, 0.035)';
        skinCtx.beginPath();
        skinCtx.moveTo(0, y);
        skinCtx.lineTo(W, y);
        skinCtx.stroke();
      }

      // Show dipping animation
      phoneRig.classList.remove('hidden');
      phoneRig.classList.add('dip-active');

      document.getElementById('stepBadge').innerText = 'Step 2: Film Transferred';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Dipped & Transferred! ✨';
      document.getElementById('stepDesc').innerText = 'Paint film was stretched, wrapped, and cured to the phone screen';

      document.getElementById('step1Controls').classList.add('hidden');
      document.getElementById('step2Controls').classList.remove('hidden');
    }

    function downloadTransferredWallpaper() {
      const skinCanvas = document.getElementById('transferredSkinCanvas');
      skinCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `hydro-transferred-wallpaper-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    function clearTank() {
      drops = [];
      initTank();
    }

    function resetApp() {
      drops = [];
      document.getElementById('phoneRig').classList.add('hidden');
      document.getElementById('phoneRig').classList.remove('dip-active');
      document.getElementById('step2Controls').classList.add('hidden');
      document.getElementById('step1Controls').classList.remove('hidden');

      document.getElementById('stepBadge').innerText = 'Step 1: Prep Fluid Tank';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Drip & Swirl Colors';
      document.getElementById('stepDesc').innerText = 'Tap to drip, drag to swirl paint on the water';

      initTank();
    }

    // PWA Support
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    initTank();
  </script>
</body>
</html>
