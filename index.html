<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Real Hydro Dip Film Extrusion</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }

    @keyframes plungeAnim {
      0% { transform: translateY(-110%) scale(0.9); opacity: 0; }
      50% { transform: translateY(0%) scale(1); opacity: 1; box-shadow: 0 0 50px rgba(236,72,153,0.7); }
      100% { transform: translateY(0%) scale(1); }
    }
    .animate-dip { animation: plungeAnim 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <!-- PWA Install Banner -->
    <div id="installBanner" class="hidden mb-4 p-3 bg-pink-500/10 border border-pink-500/30 rounded-2xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-pink-400">Install Hydro Studio</p>
        <p class="text-slate-400">Dip wallpapers offline</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-slate-950 text-xs font-bold rounded-xl transition-all">
        Install
      </button>
    </div>

    <!-- Header -->
    <div class="text-center mb-3">
      <span id="stepBadge" class="text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
        Step 1 • Fluid Surface
      </span>
      <h1 id="stepTitle" class="text-xl font-black text-white mt-1">Water Bath Tank</h1>
      <p id="stepDesc" class="text-[11px] text-slate-400">Tap to drip, drag to swirl paint. Plunge phone to adhere ribbons.</p>
    </div>

    <!-- 9:16 Tank & Phone Display -->
    <div class="relative w-full max-w-[280px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black mb-3 aspect-[9/16]">
      <canvas id="tankCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>

      <!-- Dipped Phone Skin Overlay -->
      <div id="phoneRig" class="hidden absolute inset-0 bg-black">
        <canvas id="phoneCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
        <div class="absolute inset-0 bg-gradient-to-tr from-white/20 via-transparent to-black/40 pointer-events-none"></div>
      </div>
    </div>

    <!-- Step 1 Controls -->
    <div id="step1Controls" class="space-y-3">
      <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Pigment:</span>
        <div class="flex gap-2">
          <button onclick="pickColor('#f43f5e')" class="w-7 h-7 rounded-full bg-rose-500 border-2 border-white ring-2 ring-pink-500 scale-110 color-btn"></button>
          <button onclick="pickColor('#06b6d4')" class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#fbbf24')" class="w-7 h-7 rounded-full bg-amber-400 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#7e22ce')" class="w-7 h-7 rounded-full bg-purple-700 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-transparent color-btn"></button>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="seedTank()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-colors">
          Reset 🌊
        </button>
        <button onclick="plungeAndWrapPhone()" class="w-2/3 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
          Dip Phone From Top 📱⬇️
        </button>
      </div>
      <p class="text-[10px] text-center text-slate-500">Tap to drip • Drag to swirl the paint rings</p>
    </div>

    <!-- Step 2 Controls -->
    <div id="step2Controls" class="hidden space-y-2">
      <button onclick="downloadWallpaper()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
        Download 1-of-1 Marbled Wallpaper 📥
      </button>
      <button onclick="resetBath()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition-colors">
        Fresh Water Bath 🔄
      </button>
    </div>

  </main>

  <script>
    const tankCanvas = document.getElementById('tankCanvas');
    const tankCtx = tankCanvas.getContext('2d');
    const phoneCanvas = document.getElementById('phoneCanvas');
    const phoneCtx = phoneCanvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    let currentColor = '#f43f5e';
    let drops = [];
    let isSwirling = false;
    let lastPoint = null;

    class FluidDrop {
      constructor(cx, cy, r, color) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.color = color;
        this.vertices = [];
        const pts = 140;
        for (let i = 0; i < pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          this.vertices.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
      }

      displace(other) {
        for (let v of this.vertices) {
          const dx = v.x - other.cx;
          const dy = v.y - other.cy;
          const d = Math.hypot(dx, dy);
          const factor = Math.sqrt(1 + (other.r * other.r) / (d * d || 0.001));
          v.x = other.cx + dx * factor;
          v.y = other.cy + dy * factor;
        }
      }

      tine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const mag = Math.hypot(dx, dy);
        if (mag === 0) return;
        const uX = dx / mag;
        const uY = dy / mag;
        const power = 42;
        const decay = 85;

        for (let v of this.vertices) {
          const pX = v.x - x0;
          const pY = v.y - y0;
          const perp = Math.abs(pX * (-uY) + pY * uX);
          const pull = power * Math.exp(-perp / decay);
          v.x += uX * pull;
          v.y += uY * pull;
        }
      }

      draw(c) {
        c.beginPath();
        c.fillStyle = this.color;
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          if (i === 0) c.moveTo(v.x, v.y);
          else c.lineTo(v.x, v.y);
        }
        c.closePath();
        c.fill();
      }
    }

    function initTank() {
      tankCtx.fillStyle = '#060913';
      tankCtx.fillRect(0, 0, W, H);
    }

    function pickColor(hex) {
      currentColor = hex;
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
      event.target.classList.remove('border-transparent');
    }

    function addColorDrop(x, y) {
      const r = 110 + Math.random() * 70;
      const d = new FluidDrop(x, y, r, currentColor);
      for (let existing of drops) existing.displace(d);
      drops.push(d);
      renderTank();
    }

    function renderTank() {
      initTank();
      for (let d of drops) d.draw(tankCtx);
    }

    function seedTank() {
      drops = [];
      initTank();
      // Balanced palette based on reference photos
      const pal = ['#0f051d', '#3b0764', '#7e22ce', '#c084fc', '#f43f5e', '#fb7185', '#fbbf24', '#ffffff', '#0284c7'];
      const cx = W / 2;
      const cy = H / 2 - 30;

      for (let i = 0; i < 24; i++) {
        const x = cx + (Math.random() - 0.5) * 200;
        const y = cy + (Math.random() - 0.5) * 200;
        const r = 90 + Math.random() * 85;
        const d = new FluidDrop(x, y, r, pal[i % pal.length]);
        for (let existing of drops) existing.displace(d);
        drops.push(d);
      }
      renderTank();
    }

    tankCanvas.addEventListener('pointerdown', (e) => {
      const rect = tankCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);
      isSwirling = true;
      lastPoint = { x, y };
      addColorDrop(x, y);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isSwirling || !lastPoint) return;
      const rect = tankCanvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let d of drops) d.tine(lastPoint.x, lastPoint.y, cur.x, cur.y);
      lastPoint = cur;
      renderTank();
    });

    window.addEventListener('pointerup', () => {
      isSwirling = false;
      lastPoint = null;
    });

    // HYDRO DIPPING IMMERSION WARPING
    // Maps the 2D surface rings into extruded vertical bands, matching real body marbling
    function plungeAndWrapPhone() {
      const src = tankCtx.getImageData(0, 0, W, H).data;
      const destImg = phoneCtx.createImageData(W, H);
      const dest = destImg.data;

      const tankCenterX = W / 2;
      const tankCenterY = H / 2 - 30;

      for (let y = 0; y < H; y++) {
        const v = y / H; // 0.0 (top) to 1.0 (bottom)

        // Fluid flow dynamics along the dip axis:
        // - High frequency shear creates thousands of fine bands
        // - Lateral flow stretches concentric circles into vertical ribbons
        const shearWave1 = Math.sin(v * 16.0) * 90;
        const shearWave2 = Math.cos(v * 32.0) * 45;
        const microJitter = Math.sin(v * 80.0) * 15;
        const lateralOffset = shearWave1 + shearWave2 + microJitter;

        for (let x = 0; x < W; x++) {
          const u = (x - W / 2) / (W / 2); // -1.0 to 1.0 across phone width

          // In immersion, the object pulls surrounding surface film inward.
          // Distance from the immersion axis maps to radial distance in the tank:
          const distFromAxis = Math.abs(u * 420 + lateralOffset * 0.8);

          // Vertical progress maps to radial concentric layers:
          const radialDist = distFromAxis + (v * 480);

          // Angle in tank:
          const angle = (u >= 0 ? 0.35 : Math.PI - 0.35) + Math.sin(v * 6.0) * 0.4;

          let sampleX = Math.round(tankCenterX + Math.cos(angle) * radialDist);
          let sampleY = Math.round(tankCenterY + Math.sin(angle) * radialDist);

          // Clamp to source bounds
          sampleX = Math.max(0, Math.min(W - 1, sampleX));
          sampleY = Math.max(0, Math.min(H - 1, sampleY));

          const srcIdx = (sampleY * W + sampleX) * 4;
          const destIdx = (y * W + x) * 4;

          // Surface sheen highlight
          const sheen = Math.sin(v * Math.PI * 3.0 + u * 2.0) * 0.06;
          const edgeShadow = 1.0 - Math.pow(Math.abs(u), 3.0) * 0.25; // bezel wrap falloff

          dest[destIdx]     = Math.min(255, (src[srcIdx] * (1 + sheen)) * edgeShadow);
          dest[destIdx + 1] = Math.min(255, (src[srcIdx + 1] * (1 + sheen)) * edgeShadow);
          dest[destIdx + 2] = Math.min(255, (src[srcIdx + 2] * (1 + sheen)) * edgeShadow);
          dest[destIdx + 3] = 255;
        }
      }

      phoneCtx.putImageData(destImg, 0, 0);

      // Micro-frequency anti-screenshot grating
      phoneCtx.lineWidth = 1;
      for (let y = 0; y < H; y += 4) {
        phoneCtx.strokeStyle = (y % 8 === 0) ? 'rgba(255, 255, 255, 0.035)' : 'rgba(0, 0, 0, 0.035)';
        phoneCtx.beginPath();
        phoneCtx.moveTo(0, y);
        phoneCtx.lineTo(W, y);
        phoneCtx.stroke();
      }

      // Display dipped phone animation
      const phoneRig = document.getElementById('phoneRig');
      phoneRig.classList.remove('hidden');
      phoneRig.classList.add('animate-dip');

      document.getElementById('stepBadge').innerText = 'Step 2 • Coated & Transferred';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Film Adhered to Display ✨';
      document.getElementById('stepDesc').innerText = 'All concentric tank rings wrapped into fine flowing ribbons';

      document.getElementById('step1Controls').classList.add('hidden');
      document.getElementById('step2Controls').classList.remove('hidden');
    }

    function downloadWallpaper() {
      phoneCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `hydro-marbled-1of1-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    function resetBath() {
      document.getElementById('phoneRig').classList.add('hidden');
      document.getElementById('phoneRig').classList.remove('animate-dip');
      document.getElementById('step2Controls').classList.add('hidden');
      document.getElementById('step1Controls').classList.remove('hidden');

      document.getElementById('stepBadge').innerText = 'Step 1 • Fluid Surface';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Water Bath Tank';
      document.getElementById('stepDesc').innerText = 'Tap to drip, drag to swirl paint. Plunge phone to adhere ribbons.';

      seedTank();
    }

    // PWA Support
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    seedTank();
  </script>
</body>
</html>
