<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hydro Immersion Wallpaper Engine</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }

    @keyframes plungeDip {
      0% {
        transform: translateY(-110%) scale(0.9);
        opacity: 0.2;
      }
      50% {
        transform: translateY(0%) scale(1);
        opacity: 1;
        box-shadow: 0 0 50px rgba(236, 72, 153, 0.7);
      }
      100% {
        transform: translateY(0%) scale(1);
      }
    }

    .animate-dip {
      animation: plungeDip 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <!-- Header -->
    <div class="text-center mb-3">
      <span id="stepBadge" class="text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
        Step 1 • Surface Marbling
      </span>
      <h1 id="stepTitle" class="text-xl font-black text-white mt-1">Water Bath Chamber</h1>
      <p id="stepDesc" class="text-[11px] text-slate-400">Add colors and drag your finger to swirl ribbons across the surface</p>
    </div>

    <!-- Active Chamber & Immersion Rig -->
    <div class="relative w-full max-w-[270px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black mb-3 aspect-[9/16]">
      
      <!-- Water Surface Bath -->
      <canvas id="tankCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>

      <!-- The Dipped Phone Receiving the Film -->
      <div id="phoneRig" class="hidden absolute inset-2.5 rounded-[36px] border-[6px] border-slate-950 overflow-hidden bg-black shadow-2xl">
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-20 h-4 bg-black rounded-full z-30"></div>
        <canvas id="dippedCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
        <div class="absolute inset-0 bg-gradient-to-tr from-white/20 via-transparent to-black/40 pointer-events-none z-20"></div>
      </div>

    </div>

    <!-- Step 1 Controls -->
    <div id="step1Controls" class="space-y-3">
      <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Pigment:</span>
        <div class="flex gap-2" id="paletteBar">
          <button onclick="pickColor('#f43f5e')" class="w-7 h-7 rounded-full bg-rose-500 border-2 border-white ring-2 ring-pink-500 scale-110 color-btn"></button>
          <button onclick="pickColor('#06b6d4')" class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#fbbf24')" class="w-7 h-7 rounded-full bg-amber-400 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#a855f7')" class="w-7 h-7 rounded-full bg-purple-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-transparent color-btn"></button>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="seedTank()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-colors">
          Reset Tank 🌊
        </button>
        <button onclick="calculateTopDownDip()" class="w-2/3 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
          Dip Phone From Top 📱⬇️
        </button>
      </div>
    </div>

    <!-- Step 2 Controls -->
    <div id="step2Controls" class="hidden space-y-2">
      <button onclick="downloadWallpaper()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
        Download 1-of-1 Adhered Wallpaper 📥
      </button>
      <button onclick="resetApp()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition-colors">
        Fresh Tank 🔄
      </button>
    </div>

  </main>

  <script>
    const tankCanvas = document.getElementById('tankCanvas');
    const tankCtx = tankCanvas.getContext('2d');
    const dippedCanvas = document.getElementById('dippedCanvas');
    const dippedCtx = dippedCanvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    let currentColor = '#f43f5e';
    let drops = [];
    let isSwirling = false;
    let lastPoint = null;

    class FluidDrop {
      constructor(cx, cy, r, color) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.color = color;
        this.vertices = [];
        const pts = 120;
        for (let i = 0; i < pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          this.vertices.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
      }

      displace(other) {
        for (let v of this.vertices) {
          const dx = v.x - other.cx;
          const dy = v.y - other.cy;
          const d = Math.hypot(dx, dy);
          const factor = Math.sqrt(1 + (other.r * other.r) / (d * d || 0.001));
          v.x = other.cx + dx * factor;
          v.y = other.cy + dy * factor;
        }
      }

      tine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const mag = Math.hypot(dx, dy);
        if (mag === 0) return;
        const uX = dx / mag;
        const uY = dy / mag;
        const power = 42;
        const decay = 75;

        for (let v of this.vertices) {
          const pX = v.x - x0;
          const pY = v.y - y0;
          const perp = Math.abs(pX * (-uY) + pY * uX);
          const pull = power * Math.exp(-perp / decay);
          v.x += uX * power;
          v.y += uY * power;
        }
      }

      draw(c) {
        c.beginPath();
        c.fillStyle = this.color;
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          if (i === 0) c.moveTo(v.x, v.y);
          else c.lineTo(v.x, v.y);
        }
        c.closePath();
        c.fill();
      }
    }

    function initTank() {
      tankCtx.fillStyle = '#060913';
      tankCtx.fillRect(0, 0, W, H);
    }

    function pickColor(hex) {
      currentColor = hex;
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
      event.target.classList.remove('border-transparent');
    }

    function addDrop(x, y) {
      const r = 130 + Math.random() * 80;
      const d = new FluidDrop(x, y, r, currentColor);
      for (let existing of drops) existing.displace(d);
      drops.push(d);
      renderTank();
    }

    function seedTank() {
      drops = [];
      const presets = ['#0f051d', '#e11d48', '#9333ea', '#06b6d4', '#fbbf24', '#ffffff'];
      for (let i = 0; i < 28; i++) {
        const x = W / 2 + (Math.random() - 0.5) * 500;
        const y = H / 2 + (Math.random() - 0.5) * 900;
        const r = 110 + Math.random() * 110;
        const col = presets[i % presets.length];
        const d = new FluidDrop(x, y, r, col);
        for (let existing of drops) existing.displace(d);
        drops.push(d);
      }
      renderTank();
    }

    function renderTank() {
      initTank();
      for (let d of drops) d.draw(tankCtx);
    }

    tankCanvas.addEventListener('pointerdown', (e) => {
      const rect = tankCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);
      isSwirling = true;
      lastPoint = { x, y };
      addDrop(x, y);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isSwirling || !lastPoint) return;
      const rect = tankCanvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let d of drops) d.tine(lastPoint.x, lastPoint.y, cur.x, cur.y);
      lastPoint = cur;
      renderTank();
    });

    window.addEventListener('pointerup', () => {
      isSwirling = false;
      lastPoint = null;
    });

    // Millimeter Calculation Engine for Top-Down Adhesion
    function calculateTopDownDip() {
      if (drops.length === 0) return;

      const srcData = tankCtx.getImageData(0, 0, W, H).data;
      const destImage = dippedCtx.createImageData(W, H);
      const dest = destImage.data;

      // Scan and calculate line-by-line from y = 0 to y = H
      for (let y = 0; y < H; y++) {
        // Physical immersion ratio along the dipping vector
        const immersionRatio = y / H;
        
        // As the phone cuts deeper into the liquid:
        // - Lateral compression pushes paint outward toward the glass perimeter
        // - Liquid drag pulls color downward along the entry path
        const dragFactor = Math.sin(immersionRatio * Math.PI * 0.5) * 45;
        const compressFactor = 1.0 + Math.pow(immersionRatio, 1.4) * 0.28;

        for (let x = 0; x < W; x++) {
          const normX = (x - W / 2) / (W / 2); // -1.0 to 1.0

          // Calculate displaced source sampling coordinates
          const displacedX = (W / 2) + (normX * (W / 2) / compressFactor);
          const displacedY = y - dragFactor;

          const sX = Math.max(0, Math.min(W - 1, Math.round(displacedX)));
          const sY = Math.max(0, Math.min(H - 1, Math.round(displacedY)));

          const destIdx = (y * W + x) * 4;
          const srcIdx = (sY * W + sX) * 4;

          dest[destIdx]     = srcData[srcIdx];
          dest[destIdx + 1] = srcData[srcIdx + 1];
          dest[destIdx + 2] = srcData[srcIdx + 2];
          dest[destIdx + 3] = 255;
        }
      }

      dippedCtx.putImageData(destImage, 0, 0);

      // Apply clear-coat reflection and anti-screenshot sub-pixel lines
      dippedCtx.lineWidth = 1;
      for (let y = 0; y < H; y += 4) {
        dippedCtx.strokeStyle = (y % 8 === 0) ? 'rgba(255, 255, 255, 0.035)' : 'rgba(0, 0, 0, 0.035)';
        dippedCtx.beginPath();
        dippedCtx.moveTo(0, y);
        dippedCtx.lineTo(W, y);
        dippedCtx.stroke();
      }

      const phoneRig = document.getElementById('phoneRig');
      phoneRig.classList.remove('hidden');
      phoneRig.classList.add('animate-dip');

      document.getElementById('stepBadge').innerText = 'Step 2 • Coated & Cured';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Film Adhered to Display ✨';
      document.getElementById('stepDesc').innerText = 'Colors transferred along the entry axis matching immersion fluid dynamics';

      document.getElementById('step1Controls').classList.add('hidden');
      document.getElementById('step2Controls').classList.remove('hidden');
    }

    function downloadWallpaper() {
      dippedCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `hydro-adhered-1of1-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    function resetApp() {
      document.getElementById('phoneRig').classList.add('hidden');
      document.getElementById('phoneRig').classList.remove('animate-dip');
      document.getElementById('step2Controls').classList.add('hidden');
      document.getElementById('step1Controls').classList.remove('hidden');

      document.getElementById('stepBadge').innerText = 'Step 1 • Surface Marbling';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Water Bath Chamber';
      document.getElementById('stepDesc').innerText = 'Add colors and drag your finger to swirl ribbons across the surface';

      seedTank();
    }

    seedTank();
  </script>
</body>
</html>
