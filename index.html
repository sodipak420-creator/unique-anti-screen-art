<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hydro Dip Physical Extrusion Engine</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }

    @keyframes plungeDip {
      0% {
        transform: translateY(-110%) scale(0.9);
        opacity: 0.2;
      }
      50% {
        transform: translateY(0%) scale(1);
        opacity: 1;
        box-shadow: 0 0 50px rgba(236, 72, 153, 0.7);
      }
      100% {
        transform: translateY(0%) scale(1);
      }
    }

    .animate-dip {
      animation: plungeDip 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <!-- PWA Install Banner -->
    <div id="installBanner" class="hidden mb-4 p-3 bg-pink-500/10 border border-pink-500/30 rounded-2xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-pink-400">Install Hydro Studio</p>
        <p class="text-slate-400">Dip custom wallpapers offline</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-slate-950 text-xs font-bold rounded-xl transition-all">
        Install
      </button>
    </div>

    <!-- Header -->
    <div class="text-center mb-3">
      <span id="stepBadge" class="text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
        Step 1 • Color Bath
      </span>
      <h1 id="stepTitle" class="text-xl font-black text-white mt-1">Water Bath Tank</h1>
      <p id="stepDesc" class="text-[11px] text-slate-400">Add colors in the tank. The marked contact zone dips down the screen.</p>
    </div>

    <!-- Dual View Canvas Rig -->
    <div class="relative w-full max-w-[270px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black mb-3 aspect-[9/16]">
      
      <!-- Surface Water Tank Canvas -->
      <canvas id="tankCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
      
      <!-- Interactive Contact Point Marker Overlay -->
      <div id="contactGuide" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
        <div class="w-44 h-44 rounded-full border-2 border-dashed border-white/60 bg-pink-500/10 flex items-center justify-center">
          <span class="text-[10px] font-mono text-white/90 bg-black/60 px-2 py-0.5 rounded">CONTACT ZONE</span>
        </div>
      </div>

      <!-- Result Canvas (Extruded Adhered Paint on Phone) -->
      <div id="phoneRig" class="hidden absolute inset-0 bg-black">
        <canvas id="phoneCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
        <!-- Glass Specular Reflection Highlight -->
        <div class="absolute inset-0 bg-gradient-to-tr from-white/20 via-transparent to-black/40 pointer-events-none"></div>
      </div>

    </div>

    <!-- Step 1 Controls -->
    <div id="step1Controls" class="space-y-3">
      <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Pigment:</span>
        <div class="flex gap-2" id="paletteBar">
          <button onclick="pickColor('#f43f5e')" class="w-7 h-7 rounded-full bg-rose-500 border-2 border-white ring-2 ring-pink-500 scale-110 color-btn"></button>
          <button onclick="pickColor('#06b6d4')" class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#fbbf24')" class="w-7 h-7 rounded-full bg-amber-400 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#a855f7')" class="w-7 h-7 rounded-full bg-purple-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-transparent color-btn"></button>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="resetBath()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-colors">
          Clear 🌊
        </button>
        <button onclick="calculateImmersionExtrusion()" class="w-2/3 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
          Dip Phone From Top 📱⬇️
        </button>
      </div>
      <p class="text-[10px] text-center text-slate-500">Tap to drip inside or around contact circle • Drag to swirl</p>
    </div>

    <!-- Step 2 Controls -->
    <div id="step2Controls" class="hidden space-y-2">
      <button onclick="downloadWallpaper()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
        Download 1-of-1 Marbled Wallpaper 📥
      </button>
      <button onclick="clearAndRedip()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition-colors">
        Dip Another Wallpaper 🔄
      </button>
    </div>

  </main>

  <script>
    const tankCanvas = document.getElementById('tankCanvas');
    const tankCtx = tankCanvas.getContext('2d');
    const phoneCanvas = document.getElementById('phoneCanvas');
    const phoneCtx = phoneCanvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    let currentColor = '#f43f5e';
    let drops = [];
    let isSwirling = false;
    let lastPoint = null;

    class FluidDrop {
      constructor(cx, cy, r, color) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.color = color;
        this.vertices = [];
        const pts = 120;
        for (let i = 0; i < pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          this.vertices.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
      }

      displace(other) {
        for (let v of this.vertices) {
          const dx = v.x - other.cx;
          const dy = v.y - other.cy;
          const d = Math.hypot(dx, dy);
          const factor = Math.sqrt(1 + (other.r * other.r) / (d * d || 0.001));
          v.x = other.cx + dx * factor;
          v.y = other.cy + dy * factor;
        }
      }

      tine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const mag = Math.hypot(dx, dy);
        if (mag === 0) return;
        const uX = dx / mag;
        const uY = dy / mag;
        const power = 40;
        const decay = 75;

        for (let v of this.vertices) {
          const pX = v.x - x0;
          const pY = v.y - y0;
          const perp = Math.abs(pX * (-uY) + pY * uX);
          const pull = power * Math.exp(-perp / decay);
          v.x += uX * pull;
          v.y += uY * pull;
        }
      }

      draw(c) {
        c.beginPath();
        c.fillStyle = this.color;
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          if (i === 0) c.moveTo(v.x, v.y);
          else c.lineTo(v.x, v.y);
        }
        c.closePath();
        c.fill();
      }
    }

    function initTank() {
      tankCtx.fillStyle = '#060913';
      tankCtx.fillRect(0, 0, W, H);
    }

    function pickColor(hex) {
      currentColor = hex;
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
      event.target.classList.remove('border-transparent');
    }

    function addColorDrop(x, y) {
      const r = 110 + Math.random() * 70;
      const d = new FluidDrop(x, y, r, currentColor);
      for (let existing of drops) existing.displace(d);
      drops.push(d);
      renderTank();
    }

    function renderTank() {
      initTank();
      for (let d of drops) d.draw(tankCtx);
    }

    // Default seed in and around contact circle
    function resetBath() {
      drops = [];
      initTank();
      const pal = ['#3b0764', '#7e22ce', '#c084fc', '#f43f5e', '#fb7185', '#fbbf24', '#ffffff', '#0f172a'];
      const cx = W / 2;
      const cy = H / 2 - 40; // Contact circle center
      for (let i = 0; i < 18; i++) {
        const x = cx + (Math.random() - 0.5) * 240;
        const y = cy + (Math.random() - 0.5) * 240;
        const r = 100 + Math.random() * 90;
        const d = new FluidDrop(x, y, r, pal[i % pal.length]);
        for (let existing of drops) existing.displace(d);
        drops.push(d);
      }
      renderTank();
    }

    tankCanvas.addEventListener('pointerdown', (e) => {
      const rect = tankCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);
      isSwirling = true;
      lastPoint = { x, y };
      addColorDrop(x, y);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isSwirling || !lastPoint) return;
      const rect = tankCanvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let d of drops) d.tine(lastPoint.x, lastPoint.y, cur.x, cur.y);
      lastPoint = cur;
      renderTank();
    });

    window.addEventListener('pointerup', () => {
      isSwirling = false;
      lastPoint = null;
    });

    // PHYSICAL EXTENSION ENGINE:
    // Samples the colors inside your red contact circle and stretches them millimeter-by-millimeter from top to bottom
    function calculateImmersionExtrusion() {
      const srcPixels = tankCtx.getImageData(0, 0, W, H).data;
      const destImage = phoneCtx.createImageData(W, H);
      const dest = destImage.data;

      // Center and radius of your contact circle
      const contactCx = W / 2;
      const contactCy = H / 2 - 40;
      const contactR = 190;

      // Build 1D contact slice across the contact circle
      const sliceLength = contactR * 2;
      const contactColors = [];

      for (let i = 0; i < sliceLength; i++) {
        const sampleX = Math.round((contactCx - contactR) + i);
        const sampleY = Math.round(contactCy + Math.sin((i / sliceLength) * Math.PI) * 20); // slightly curved meniscus

        const idx = (sampleY * W + sampleX) * 4;
        contactColors.push([
          srcPixels[idx] || 0,
          srcPixels[idx + 1] || 0,
          srcPixels[idx + 2] || 0
        ]);
      }

      // Extrude from top (y=0) to bottom (y=1920) across all screen millimeters
      for (let y = 0; y < H; y++) {
        const progress = y / H; // 0.0 (top of phone) to 1.0 (bottom of phone)

        // Fluid wave dynamics:
        // - Lateral fluid drift as the phone pushes through water
        // - High frequency shear ripples that turn thick blocks into razor-thin bands (like the hand photo)
        const wave1 = Math.sin(progress * 12.0) * 85;
        const wave2 = Math.cos(progress * 26.0) * 35;
        const microShear = Math.sin(progress * 75.0) * 14;
        const totalDisplacement = wave1 + wave2 + microShear;

        for (let x = 0; x < W; x++) {
          // Map x-coordinate across the contact circle
          let normX = (x + totalDisplacement) / W;

          // Compression toward edges as fluid flows around phone frame
          normX = 0.5 + (normX - 0.5) * (0.85 + progress * 0.3);

          // Bound and convert to slice index
          let sliceIdx = Math.floor(normX * (sliceLength - 1));
          sliceIdx = Math.max(0, Math.min(sliceLength - 1, sliceIdx));

          const col = contactColors[sliceIdx];

          // Add liquid clear-coat lighting gradient
          const rimLight = Math.pow(Math.abs(x - W/2) / (W/2), 2.5) * 0.2;
          const sheen = Math.sin(progress * Math.PI * 2 + (x / W) * 3) * 0.05;

          const destIdx = (y * W + x) * 4;
          dest[destIdx]     = Math.min(255, col[0] * (1 + sheen) + rimLight * 255);
          dest[destIdx + 1] = Math.min(255, col[1] * (1 + sheen) + rimLight * 255);
          dest[destIdx + 2] = Math.min(255, col[2] * (1 + sheen) + rimLight * 255);
          dest[destIdx + 3] = 255;
        }
      }

      phoneCtx.putImageData(destImage, 0, 0);

      // Add sub-pixel anti-screenshot barrier
      phoneCtx.lineWidth = 1;
      for (let y = 0; y < H; y += 4) {
        phoneCtx.strokeStyle = (y % 8 === 0) ? 'rgba(255, 255, 255, 0.035)' : 'rgba(0, 0, 0, 0.035)';
        phoneCtx.beginPath();
        phoneCtx.moveTo(0, y);
        phoneCtx.lineTo(W, y);
        phoneCtx.stroke();
      }

      // Reveal phone view with plunge animation
      document.getElementById('contactGuide').classList.add('hidden');
      const phoneRig = document.getElementById('phoneRig');
      phoneRig.classList.remove('hidden');
      phoneRig.classList.add('animate-dip');

      document.getElementById('stepBadge').innerText = 'Step 2 • Adhered 1-of-1';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Film Adhered From Top ✨';
      document.getElementById('stepDesc').innerText = 'Colors from contact zone extruded into dense flowing striations';

      document.getElementById('step1Controls').classList.add('hidden');
      document.getElementById('step2Controls').classList.remove('hidden');
    }

    function downloadWallpaper() {
      phoneCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `hydro-marbled-1of1-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    function clearAndRedip() {
      document.getElementById('phoneRig').classList.add('hidden');
      document.getElementById('phoneRig').classList.remove('animate-dip');
      document.getElementById('contactGuide').classList.remove('hidden');
      document.getElementById('step2Controls').classList.add('hidden');
      document.getElementById('step1Controls').classList.remove('hidden');

      document.getElementById('stepBadge').innerText = 'Step 1 • Color Bath';
      document.getElementById('stepBadge').className = 'text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full';
      document.getElementById('stepTitle').innerText = 'Water Bath Tank';
      document.getElementById('stepDesc').innerText = 'Add colors in the tank. The marked contact zone dips down the screen.';

      resetBath();
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    resetBath();
  </script>
</body>
</html>
