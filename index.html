<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Real Dipped Screen Wallpaper</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f43f5e" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900/95 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <div id="installBanner" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-rose-400">Install Dipped Studio</p>
        <p class="text-slate-400">Generate wet lock screens offline</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-slate-950 text-xs font-bold rounded-xl transition-all">
        Install
      </button>
    </div>

    <div class="text-center mb-3">
      <span class="text-[10px] font-black uppercase tracking-widest bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full">
        Full-Bleed Screen Illusion
      </span>
      <h1 class="text-xl font-black text-white mt-1.5 tracking-tight">Real Dipped Paint Glass</h1>
      <p class="text-[11px] text-slate-400">Makes your physical phone look like it was pulled out of wet paint</p>
    </div>

    <div class="relative w-full max-w-[270px] mx-auto rounded-[36px] overflow-hidden border-[6px] border-slate-950 shadow-2xl bg-black mb-3 aspect-[9/16]">
      <canvas id="wallpaperCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
      
      <div class="absolute top-12 left-0 right-0 text-center pointer-events-none">
        <p class="text-5xl font-light text-white/80 tracking-tight">09:41</p>
        <p class="text-xs font-medium text-white/50 mt-1">Thursday, September 3</p>
      </div>
    </div>

    <div class="space-y-3 text-xs">
      
      <div class="bg-slate-950 p-2.5 rounded-2xl border border-slate-800 flex items-center justify-between">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px]">Liquid Paint:</span>
        <div class="flex gap-2">
          <button onclick="setTheme('#e11d48', '#881337', '#fda4af')" title="Wet Crimson" class="w-7 h-7 rounded-full bg-rose-600 border-2 border-white ring-2 ring-rose-500 scale-110 color-btn"></button>
          <button onclick="setTheme('#0284c7', '#082f49', '#7dd3fc')" title="Ocean Slime" class="w-7 h-7 rounded-full bg-sky-600 border-2 border-transparent color-btn"></button>
          <button onclick="setTheme('#7c3aed', '#2e1065', '#d8b4fe')" title="Deep Toxic Violet" class="w-7 h-7 rounded-full bg-purple-600 border-2 border-transparent color-btn"></button>
          <button onclick="setTheme('#10b981', '#022c22', '#6ee7b7')" title="Acid Green" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent color-btn"></button>
          <button onclick="setTheme('#f59e0b', '#78350f', '#fde68a')" title="Molten Gold" class="w-7 h-7 rounded-full bg-amber-500 border-2 border-transparent color-btn"></button>
        </div>
      </div>

      <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1">
        <div class="flex justify-between font-bold text-slate-400 text-[10px] uppercase">
          <span>Paint Submersion Level</span>
          <span id="depthLabel" class="text-rose-400 font-mono">Bottom 40%</span>
        </div>
        <input id="depthSlider" type="range" min="15" max="65" value="40" oninput="adjustPaintLevel(this.value)" class="w-full accent-rose-500 cursor-pointer" />
      </div>

      <div class="space-y-2">
        <button onclick="randomizeDrips()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition-colors">
          Reroll Random Paint Drips 🎲
        </button>

        <button onclick="downloadWallpaper()" class="w-full bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-rose-500/20 active:scale-95 transition-all">
          Download 1-of-1 Dipped Wallpaper 📥
        </button>
      </div>

    </div>

    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-center">
      <iframe srcdoc="<!DOCTYPE html><html><head></head><body style='margin:0;display:flex;justify-content:center;'><script type='text/javascript'>atOptions={'key':'45775fbece61c0f117b4d413d29f50b6','format':'iframe','height':50,'width':320,'params':{}};</script><script type='text/javascript' src='https://www.highrevenueformat.com/45775fbece61c0f117b4d413d29f50b6/invoke.js'></script></body></html>" width="320" height="50" style="border:none; overflow:hidden;" scrolling="no" sandbox="allow-scripts allow-same-origin allow-popups allow-top-navigation"></iframe>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('wallpaperCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    let paintColor = '#e11d48';
    let darkTone = '#881337';
    let lightTone = '#fda4af';
    let dipHeight = 0.40; // 40% from bottom

    // Procedural liquid drips
    let liquidStreams = [];

    function generateStreams() {
      liquidStreams = [];
      const numStreams = 8;
      for (let i = 0; i < numStreams; i++) {
        liquidStreams.push({
          x: 100 + (i * 125) + (Math.random() * 40 - 20),
          len: 120 + Math.random() * 320,
          width: 32 + Math.random() * 35,
          bulbSize: 18 + Math.random() * 16
        });
      }
    }

    function setTheme(main, dark, light) {
      paintColor = main;
      darkTone = dark;
      lightTone = light;

      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-rose-500');
        btn.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-rose-500');
      event.target.classList.remove('border-transparent');

      renderDippedGlass();
    }

    function adjustPaintLevel(val) {
      dipHeight = val / 100;
      document.getElementById('depthLabel').innerText = `Bottom ${val}%`;
      renderDippedGlass();
    }

    function randomizeDrips() {
      generateStreams();
      renderDippedGlass();
    }

    function renderDippedGlass() {
      // 1. Deep OLED Pitch Black Glass Top (Preserves phone battery and lock screen clock legibility)
      ctx.fillStyle = '#010204';
      ctx.fillRect(0, 0, W, H);

      // 2. Subtle glass studio diagonal sheen
      const glassReflect = ctx.createLinearGradient(0, 0, W, H);
      glassReflect.addColorStop(0.15, 'rgba(255, 255, 255, 0.05)');
      glassReflect.addColorStop(0.25, 'rgba(255, 255, 255, 0.01)');
      glassReflect.addColorStop(0.5, 'transparent');
      ctx.fillStyle = glassReflect;
      ctx.fillRect(0, 0, W, H);

      const waterlineY = H - (H * dipHeight);

      // 3. Thick Viscous Paint Slab at Bottom
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, waterlineY);

      // Meniscus liquid wave curve
      ctx.bezierCurveTo(W * 0.25, waterlineY - 35, W * 0.75, waterlineY + 40, W, waterlineY);
      ctx.lineTo(W, H);
      ctx.closePath();

      // Liquid depth gradient
      const paintGrad = ctx.createLinearGradient(0, waterlineY, 0, H);
      paintGrad.addColorStop(0, paintColor);
      paintGrad.addColorStop(0.35, darkTone);
      paintGrad.addColorStop(1, '#050203');
      ctx.fillStyle = paintGrad;
      ctx.fill();

      // 4. Downward Viscous Drips & Gravity Fingers
      liquidStreams.forEach(stream => {
        const startY = waterlineY;
        const endY = waterlineY + stream.len;

        // Drip spine
        ctx.beginPath();
        ctx.fillStyle = paintColor;
        ctx.moveTo(stream.x - stream.width / 2, startY);
        ctx.quadraticCurveTo(stream.x - stream.width / 4, endY - 30, stream.x, endY);
        ctx.quadraticCurveTo(stream.x + stream.width / 4, endY - 30, stream.x + stream.width / 2, startY);
        ctx.fill();

        // Droplet teardrop bulb
        ctx.beginPath();
        ctx.arc(stream.x, endY, stream.bulbSize, 0, Math.PI * 2);
        ctx.fillStyle = paintColor;
        ctx.fill();

        // High gloss liquid specular core
        ctx.beginPath();
        ctx.arc(stream.x - stream.bulbSize * 0.25, endY - stream.bulbSize * 0.25, stream.bulbSize * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = lightTone;
        ctx.fill();

        // Linear light reflection down the spine of the drip
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(stream.x - 3, startY + 15);
        ctx.lineTo(stream.x - 3, endY - stream.bulbSize * 0.6);
        ctx.stroke();
      });

      // 5. Heavy Surface Tension Meniscus Ridge (The raised wet bead of paint)
      ctx.lineWidth = 8;
      ctx.strokeStyle = lightTone;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, waterlineY);
      ctx.bezierCurveTo(W * 0.25, waterlineY - 35, W * 0.75, waterlineY + 40, W, waterlineY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 6. Scattered Wet Paint Splatters Above Waterline
      const splatters = [
        { x: 180, y: waterlineY - 70, r: 8 },
        { x: 360, y: waterlineY - 140, r: 12 },
        { x: 520, y: waterlineY - 95, r: 6 },
        { x: 740, y: waterlineY - 180, r: 14 },
        { x: 880, y: waterlineY - 60, r: 9 }
      ];

      splatters.forEach(s => {
        // Droplet body
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = paintColor;
        ctx.fill();

        // Specular dot
        ctx.beginPath();
        ctx.arc(s.x - s.r * 0.3, s.y - s.r * 0.3, s.r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = lightTone;
        ctx.fill();
      });

      // 7. Full-Bleed Curved Edge Shadow (Simulates paint wrapping over native phone glass bezels)
      const edgeVignette = ctx.createRadialGradient(W/2, H/2, W * 0.45, W/2, H/2, W * 0.72);
      edgeVignette.addColorStop(0, 'rgba(0,0,0,0)');
      edgeVignette.addColorStop(0.85, 'rgba(0,0,0,0.4)');
      edgeVignette.addColorStop(1, 'rgba(0,0,0,0.9)');
      ctx.fillStyle = edgeVignette;
      ctx.fillRect(0, 0, W, H);
    }

    function downloadWallpaper() {
      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `dipped-screen-${Date.now()}.png`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }, 'image/png');
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    generateStreams();
    renderDippedGlass();
  </script>
</body>
</html>
