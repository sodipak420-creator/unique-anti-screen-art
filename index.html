<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hydro Dip 1-of-1 Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans select-none overflow-x-hidden">

  <main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-4 border border-slate-800 mt-2 mb-8">
    
    <!-- Header -->
    <div class="text-center mb-3">
      <span class="text-[10px] font-black uppercase tracking-widest bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
        Direct Marbling Studio
      </span>
      <h1 class="text-xl font-black text-white mt-1">Hydro Marbled Wallpaper</h1>
      <p class="text-[11px] text-slate-400">Drip and swirl your pattern. What you see is exactly what downloads.</p>
    </div>

    <!-- Active Wallpaper Canvas (Full 9:16 Native) -->
    <div class="relative w-full max-w-[280px] mx-auto rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black mb-3 aspect-[9/16]">
      <canvas id="artCanvas" width="1080" height="1920" class="w-full h-full object-cover"></canvas>
      <img id="exportPreview" class="hidden absolute inset-0 w-full h-full object-cover z-20" alt="Dipped Wallpaper" />
    </div>

    <!-- Controls -->
    <div class="space-y-3 text-xs">
      
      <!-- Pigment Selection -->
      <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px] pl-1">Pigment:</span>
        <div class="flex gap-2" id="paletteBar">
          <button onclick="pickColor('#f43f5e')" class="w-7 h-7 rounded-full bg-rose-500 border-2 border-white ring-2 ring-pink-500 scale-110 color-btn"></button>
          <button onclick="pickColor('#06b6d4')" class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#fbbf24')" class="w-7 h-7 rounded-full bg-amber-400 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#7e22ce')" class="w-7 h-7 rounded-full bg-purple-700 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent color-btn"></button>
          <button onclick="pickColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-transparent color-btn"></button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="seedTank()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-colors">
          Reset Pattern 🔄
        </button>
        <button onclick="clearCanvas()" class="w-full bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold py-3 rounded-xl text-xs transition-colors">
          Clear Blank 🌊
        </button>
      </div>

      <button onclick="saveArtwork()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
        Download Marbled Wallpaper 📥
      </button>

      <p id="helperText" class="text-[10px] text-center text-slate-500">
        Tap anywhere to add rings • Drag finger across screen to swirl
      </p>

    </div>

  </main>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('exportPreview');
    const W = 1080;
    const H = 1920;

    let currentColor = '#f43f5e';
    let drops = [];
    let isSwirling = false;
    let lastPoint = null;

    class FluidDrop {
      constructor(cx, cy, r, color) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.color = color;
        this.vertices = [];
        const pts = 160;
        for (let i = 0; i < pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          this.vertices.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
      }

      displace(other) {
        for (let v of this.vertices) {
          const dx = v.x - other.cx;
          const dy = v.y - other.cy;
          const d = Math.hypot(dx, dy);
          const factor = Math.sqrt(1 + (other.r * other.r) / (d * d || 0.001));
          v.x = other.cx + dx * factor;
          v.y = other.cy + dy * factor;
        }
      }

      tine(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const mag = Math.hypot(dx, dy);
        if (mag === 0) return;
        const uX = dx / mag;
        const uY = dy / mag;
        const power = 48;
        const decay = 90;

        for (let v of this.vertices) {
          const pX = v.x - x0;
          const pY = v.y - y0;
          const perp = Math.abs(pX * (-uY) + pY * uX);
          const pull = power * Math.exp(-perp / decay);
          v.x += uX * pull;
          v.y += uY * pull;
        }
      }

      draw(c) {
        c.beginPath();
        c.fillStyle = this.color;
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          if (i === 0) c.moveTo(v.x, v.y);
          else c.lineTo(v.x, v.y);
        }
        c.closePath();
        c.fill();
      }
    }

    function initBackground() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, W, H);
    }

    function pickColor(hex) {
      currentColor = hex;
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
        b.classList.add('border-transparent');
      });
      event.target.classList.add('scale-110', 'border-white', 'ring-2', 'ring-pink-500');
      event.target.classList.remove('border-transparent');
    }

    function addColorDrop(x, y) {
      const r = 110 + Math.random() * 70;
      const d = new FluidDrop(x, y, r, currentColor);
      for (let existing of drops) existing.displace(d);
      drops.push(d);
      renderScene();
    }

    function renderScene() {
      initBackground();
      for (let d of drops) d.draw(ctx);
    }

    function seedTank() {
      previewImg.classList.add('hidden');
      drops = [];
      initBackground();
      const pal = ['#080414', '#3b0764', '#7e22ce', '#c084fc', '#06b6d4', '#f43f5e', '#fb7185', '#fbbf24', '#ffffff', '#0369a1'];
      const cx = W / 2;
      const cy = H / 2 - 20;

      for (let i = 0; i < 26; i++) {
        const x = cx + (Math.random() - 0.5) * 140;
        const y = cy + (Math.random() - 0.5) * 140;
        const r = 90 + Math.random() * 80;
        const d = new FluidDrop(x, y, r, pal[i % pal.length]);
        for (let existing of drops) existing.displace(d);
        drops.push(d);
      }
      renderScene();
    }

    function clearCanvas() {
      previewImg.classList.add('hidden');
      drops = [];
      initBackground();
    }

    // Touch & Pointer Handlers
    canvas.addEventListener('pointerdown', (e) => {
      previewImg.classList.add('hidden');
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);
      isSwirling = true;
      lastPoint = { x, y };
      addColorDrop(x, y);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isSwirling || !lastPoint) return;
      const rect = canvas.getBoundingClientRect();
      const cur = {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };

      for (let d of drops) d.tine(lastPoint.x, lastPoint.y, cur.x, cur.y);
      lastPoint = cur;
      renderScene();
    });

    window.addEventListener('pointerup', () => {
      isSwirling = false;
      lastPoint = null;
    });

    // DIRECT EXPORT: No conversion, no transformation, instant download
    function saveArtwork() {
      try {
        const dataUrl = canvas.toDataURL('image/png', 1.0);
        
        // Show as image directly so user can also long-press save
        previewImg.src = dataUrl;
        previewImg.classList.remove('hidden');

        // Immediate programmatic download
        const a = document.createElement('a');
        a.download = `hydro-marbled-${Date.now()}.png`;
        a.href = dataUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        document.getElementById('helperText').innerText = "Wallpaper ready! If download didn't trigger, long-press the screen to save.";
        document.getElementById('helperText').className = "text-[11px] text-center text-emerald-400 font-bold";
      } catch (err) {
        alert("Please long-press the artwork to save it directly to your gallery.");
      }
    }

    seedTank();
  </script>
</body>
</html>
